# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#
$color_accent = rgba(82FB9Cee)
$color_cursor = rgba(ddf7ffee)
$color_foreground = rgba(ddf7ffee)
$color_background = rgba(0B0C1600)
$color_color0 = rgba(3E4058ee)
$color_color1 = rgba(50f872ee)
$color_color2 = rgba(4fe88fee)
$color_color3 = rgba(50f7d4ee)
$color_color4 = rgba(829dd4ee)
$color_color5 = rgba(86a7dfee)
$color_color6 = rgba(7cf8f7ee)
$color_color7 = rgba(85E1FBee)
$color_color8 = rgba(6a6e95ee)
$color_color9 = rgba(85ff9dee)
$color_color10 = rgba(9cf7c2ee)
$color_color11 = rgba(a4ffecee)
$color_color12 = rgba(c4d2edee)
$color_color13 = rgba(cddbf4ee)
$color_color14 = rgba(d1fffeee)
$color_color15 = rgba(ddf7ffee)

$font = Jet Brains Nerf Font

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = false
}

background {
    monitor =
    path = screenshot
    color = $color_background
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $color_color1 $color_color3 90deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # uncomment if you wish to display a message during authentication
    # check_text = Authenticating...

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[en]
    font_size = 24
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
